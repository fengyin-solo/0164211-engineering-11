name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 支持手动触发，修复后可直接重试
  workflow_dispatch:

jobs:
  check:
    name: 门户网站代码检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-portal
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js（含 npm 缓存）
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-portal/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型校验
        run: npm run type-check

      - name: 代码检查
        run: npm run lint
